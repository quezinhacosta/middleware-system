name: CI - Code Quality & Tests

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  lint-and-quality:
    name: Lint, Type Check & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências de Desenvolvimento
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar Linting com Ruff
        run: |
          ruff check .

      - name: Verificar Formatação com Ruff
        run: |
          ruff format --check .

      - name: Checagem de Tipagem Estática com Mypy
        run: |
          mypy . --ignore-missing-imports --config-file=pyproject.toml

      - name: Executar Testes Automatizados (se existirem)
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "Diretorio tests/ sera implementado nas proximas issues. Pulando execucao de testes."
          fi

