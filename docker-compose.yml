name: middleware-system

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

volumes:
  rabbitmq_data:
    name: rabbitmq_data
  payment_idempotency:
    name: payment_idempotency

services:
  message-broker:
    container_name: message-broker
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?Defina RABBITMQ_DEFAULT_USER no arquivo .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS no arquivo .env}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE:-supersecretcookie2026}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s

  order-service:
    container_name: order-service
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.order_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=order-service
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AMQP_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@message-broker:5672/
      - RABBITMQ_HOST=${RABBITMQ_HOST:-message-broker}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-distributed-middleware-key-change-in-production-2026}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-60}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-3.0}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:8000}
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL:-http://catalog-service:8001}
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  catalog-service:
    container_name: catalog-service
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.catalog_service.main:app --host 0.0.0.0 --port 8001
    expose:
      - "8001"
    environment:
      - SERVICE_NAME=catalog-service
      - PORT=8001
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RABBITMQ_HOST=message-broker
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-distributed-middleware-key-change-in-production-2026}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-60}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-3.0}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://order-service:8000}
      - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL:-http://catalog-service:8001}
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  notification-service:
    container_name: notification-service
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.notification_service.main:app --host 0.0.0.0 --port 8002
    # Porta interna: a consulta de notificacoes e feita pela rede interna (nao exposta no host)
    expose:
      - "8002"
    environment:
      - SERVICE_NAME=notification-service
      - PORT=8002
      - LOG_LEVEL=INFO
      - AMQP_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@message-broker:5672/
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - ecommerce-network
  payment-service:
    container_name: payment-service
    build:
      context: .
      dockerfile: Dockerfile
    command: python services/payment_service/main.py
    expose:
      - "8002"
    environment:
      - SERVICE_NAME=payment-service
      - PORT=8002
      - PYTHONPATH=.
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RABBITMQ_HOST=message-broker
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS}
      - IDEMPOTENCY_DB_PATH=/data/idempotency.db
      - MAX_RETRIES=${MAX_RETRIES:-3}
    volumes:
      - payment_idempotency:/data
    networks:
      - ecommerce-network
    depends_on:
      message-broker:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
