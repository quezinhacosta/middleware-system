name: middleware-system

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

services:
  order-service:
    container_name: order-service
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.order_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=order-service
      - PORT=8000
      - CATALOG_SERVICE_URL=http://catalog-service:8001
      - LOG_LEVEL=INFO
    networks:
      - ecommerce-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  catalog-service:
    container_name: catalog-service
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.catalog_service.main:app --host 0.0.0.0 --port 8001
    expose:
      - "8001"
    environment:
      - SERVICE_NAME=catalog-service
      - PORT=8001
      - LOG_LEVEL=INFO
    networks:
      - ecommerce-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - ecommerce-network
    restart: unless-stopped

  payment-service:
    container_name: payment-service
    build:
      context: .
      dockerfile: Dockerfile
    command: python services/payment-service/main.py
    environment:
      - RABBITMQ_HOST=rabbitmq
    networks:
      - ecommerce-network
    depends_on:
      - rabbitmq
    restart: unless-stopped