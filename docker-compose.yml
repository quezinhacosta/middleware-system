name: middleware-system

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

volumes:
  rabbitmq_data:
    name: rabbitmq_data

services:
  message-broker:
    container_name: message-broker
    image: rabbitmq:3-management-alpine
    # AMQP (5672) fica acessivel apenas na rede interna; o painel (15672) e exposto no host
    expose:
      - "5672"
    ports:
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?Defina RABBITMQ_DEFAULT_USER no arquivo .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS no arquivo .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  order-service:
    container_name: order-service
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.order_service.main:app --host 0.0.0.0 --port 8000
    ports:
      # Ponto de entrada do cliente/gateway exposto para o host
      - "8000:8000"
    environment:
      - SERVICE_NAME=order-service
      - PORT=8000
      - CATALOG_SERVICE_URL=http://catalog-service:8001
      - AMQP_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@message-broker:5672/
      - LOG_LEVEL=INFO
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  catalog-service:
    container_name: catalog-service
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.catalog_service.main:app --host 0.0.0.0 --port 8001
    # Porta interna acessivel apenas pelos containers da rede ecommerce-network (nao exposta no host)
    expose:
      - "8001"
    environment:
      - SERVICE_NAME=catalog-service
      - PORT=8001
      - LOG_LEVEL=INFO
    networks:
      - ecommerce-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  notification-service:
    container_name: notification-service
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.notification_service.main:app --host 0.0.0.0 --port 8002
    # Porta interna: a consulta de notificacoes e feita pela rede interna (nao exposta no host)
    expose:
      - "8002"
    environment:
      - SERVICE_NAME=notification-service
      - PORT=8002
      - LOG_LEVEL=INFO
      - AMQP_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@message-broker:5672/
    depends_on:
      message-broker:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

